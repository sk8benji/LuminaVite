<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <linearGradient id="watercolorWashTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="60%" stop-color="#EBF4FB" stop-opacity="0.95" />
      <stop offset="85%" stop-color="#D2E7F7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#C2DCF2" stop-opacity="0.6" />
    </linearGradient>
    <filter id="tornEdgeFuzz" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  
  <!-- Sombra suave del rasgado -->
  <path d="M 0,0 L 1000,0 L 1000,165 Q 920,135 840,150 T 670,185 T 500,140 T 320,195 T 160,145 T 0,170 Z" 
        fill="#000000" opacity="0.12" filter="url(#tornEdgeFuzz)" transform="translate(0, 5)" />
        
  <!-- Capa base de rasgado blanco acuarela -->
  <path d="M 0,0 L 1000,0 L 1000,160 Q 920,130 840,145 T 670,180 T 500,135 T 320,190 T 160,140 T 0,165 Z" 
        fill="url(#watercolorWashTop)" filter="url(#tornEdgeFuzz)" />
</svg>
